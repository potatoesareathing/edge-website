<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="EDGE">
  <!-- Traced from the club logo: a rounded head with one angular eye and a
       smaller notch, tapering to a point at the lower left. The fill is explicit, not currentColor:
       an SVG loaded through <img> is its own document and cannot inherit the
       page's colour, so currentColor would render it black. -->
  <path fill="#F5F5F3" fill-rule="evenodd" d="
