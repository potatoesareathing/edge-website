# Static site: nothing to build. Netlify serves the repo root as-is.
[build]
  publish = "."
  command = ""

# Long-cache the fingerprint-free assets but always revalidate the HTML, so a
# content edit in js/content.js shows up immediately rather than after a cache
# expiry the committee cannot see.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Video is large and effectively immutable, so cache it hard.
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Everything else in assets revalidates. A day-long cache here meant a logo
# fix did not reach anyone for 24 hours — the old file kept being served and
# the logo looked broken long after it was corrected. Versioned URLs handle
# the immediate case; this stops the class of problem.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
